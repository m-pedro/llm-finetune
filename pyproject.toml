[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetune"
version = "0.1.0"
description = "Parameter-Efficient LLM Fine-Tuning & Alignment from scratch in PyTorch: LoRA, DoRA, 4-bit NF4 QLoRA, SFT, and DPO"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
